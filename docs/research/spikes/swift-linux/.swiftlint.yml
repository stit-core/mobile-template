# Профиль поверх дефолта SwiftLint: отключаем шум, включаем строгие правила.
strict: true

included:
  - Sources
  - Tests

excluded:
  - .build
  - Generated

analyzer_rules:
  - unused_declaration
  - unused_import

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - multiline_arguments
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_in_static_references
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

disabled_rules:
  - todo
  # Формат — зона ответственности swift-format; его правило TrailingComma
  # ТРЕБУЕТ висящую запятую, а swiftlint по умолчанию её ЗАПРЕЩАЕТ.
  # Две автофиксилки будут вечно переписывать друг друга — правило выключено.
  - trailing_comma

line_length:
  warning: 120
  error: 140
  ignores_comments: true

identifier_name:
  min_length: 2
  excluded: [id, db, ok, vm]

type_name:
  min_length: 3

custom_rules:
  no_print:
    name: "print запрещён"
    regex: '(^|\s)print\('
    message: "Логи идут через Logger, не print()."
    severity: error
  no_force_try:
    name: "try! запрещён"
    regex: 'try!'
    message: "try! ломает приложение в проде."
    severity: error
