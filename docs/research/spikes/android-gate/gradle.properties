# --- JVM/ресурсы: машина под нагрузкой, держим потолки низкими ---
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.workers.max=4
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

# --- Kotlin/KSP демоны ---
kotlin.daemon.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=384m
kotlin.code.style=official

# --- AndroidX / AGP ---
android.useAndroidX=true
android.nonTransitiveRClass=true

# --- Kotlin Multiplatform ---
# iOS-таргеты на Linux собираются до klib, но не линкуются: глушим предупреждения
# про отключённые native-таски, чтобы вывод оставался читаемым для агента.
kotlin.native.ignoreDisabledTargets=true
