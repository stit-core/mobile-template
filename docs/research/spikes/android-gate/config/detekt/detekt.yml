# Профиль поверх detekt default (buildUponDefaultConfig = true) — только дельты.
build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: true

complexity:
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
    ignoreAnnotated: ['Composable', 'Inject']
  TooManyFunctions:
    ignoreAnnotatedFunctions: ['Composable']
    thresholdInFiles: 20
    thresholdInClasses: 20

style:
  MagicNumber:
    # Именованная константа — и есть починка MagicNumber; токены дизайн-системы
    # (0xFF……) живут именно в property-декларациях.
    ignorePropertyDeclaration: true
    ignoreAnnotated: ['Composable', 'Preview']
  ForbiddenImport:
    active: true
    imports:
      - value: 'android.util.Log'
        reason: 'Логи идут через core:logging (structured), не через android.util.Log.'
      - value: 'java.util.Date'
        reason: 'Только kotlinx-datetime / java.time.'
    forbiddenPatterns: ''
  ForbiddenComment:
    active: true
    comments:
      - value: 'FIXME:'
        reason: 'FIXME в main-ветке не живёт — заводи запись в roadmap.'
  MaxLineLength:
    maxLineLength: 140
    excludeCommentStatements: true

naming:
  FunctionNaming:
    # @Composable-функции именуются с большой буквы
    ignoreAnnotated: ['Composable']

Compose:
  ComposableAnnotationNaming:
    active: true
  ComposableNaming:
    active: true
  ComposableParamOrder:
    active: true
  CompositionLocalAllowlist:
    active: true
    allowedCompositionLocals: 'LocalStitSpacing,LocalStitColors'
  CompositionLocalNaming:
    active: true
  ContentEmitterReturningValues:
    active: true
  ModifierComposed:
    active: true
  ModifierMissing:
    active: true
  ModifierNotUsedAtRoot:
    active: true
  ModifierReused:
    active: true
  ModifierWithoutDefault:
    active: true
  MultipleEmitters:
    active: true
  MutableParams:
    active: true
  PreviewAnnotationNaming:
    active: true
  PreviewPublic:
    active: true
  RememberMissing:
    active: true
  UnstableCollections:
    active: false
  ViewModelForwarding:
    active: true
  ViewModelInjection:
    active: true
