# Память: пара демонов Gradle + Kotlin занимает ~4.8 ГБ RSS даже при Xmx2g.
# Меньше 1g метаспейса ломает Android Lint (OutOfMemoryError: Metaspace).
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=build/ -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=384m

# Параллелизм: не больше 4 воркеров — иначе на нагруженной машине уходим в swap.
org.gradle.workers.max=4
org.gradle.parallel=true

# Кеши: configuration cache экономит ~10 с на каждый прогон гейта.
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# KMP: iOS-таргеты на Linux компилируются до klib, но не тестируются — глушим предупреждения об этом.
kotlin.native.ignoreDisabledTargets=true
