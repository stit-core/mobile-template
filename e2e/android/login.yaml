# Вход в demo: любые непустые email и пароль принимаются MockTransport (сценарий populated).
appId: tech.stit.mobile.demo.debug
---
- launchApp:
    clearState: true
- tapOn:
    id: "login_email"
- inputText: "demo@example.com"
- tapOn:
    id: "login_password"
- inputText: "password"
- tapOn:
    id: "login_submit"
- assertVisible:
    id: "todo_list"
